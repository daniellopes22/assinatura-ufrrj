# Netlify Configuration
# Deploy automático e headers de segurança

[build]
  # Sem build - site estático single-file
  publish = "."

[[headers]]
  # Headers de segurança para todas as rotas
  for = "/*"
  [headers.values]
    # Previne clickjacking
    X-Frame-Options = "SAMEORIGIN"
    # Previne MIME sniffing
    X-Content-Type-Options = "nosniff"
    # Controla referrer
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions Policy - restringe APIs sensíveis
    Permissions-Policy = "clipboard-read=(), clipboard-write=(self), geolocation=(), microphone=(), camera=()"
    # Content Security Policy
    # Nota: 'unsafe-inline' necessário para CSS/JS inline no single-file
    Content-Security-Policy = "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https://institucional.ufrrj.br data:; connect-src 'self'; script-src 'self' 'unsafe-inline'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

[[headers]]
  # Cache agressivo para assets estáticos (se houver no futuro)
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects (exemplo para futuras versões)
